<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/carrito.css">
    <script defer src="../assets/js/carrito.js"></script>
    <title>Carrito - ElectroSmart</title>
</head>
<body>

    <header>

        <div id="brand">
            <a href="../landing.html">
                <div id="brand-icon">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <span>ElectroSmart</span>
            </a>
            
        </div>

        <div id="opciones-div">
            <a href="../pages/productos.html" id="seguir-comprando-btn">
                <i class="fa-solid fa-arrow-left-long"></i>seguir comprando
            </a>

            <div id="perfil-dropdown">
            <button id="perfil-btn">
                <div id="foto-perfil-dropdown"></div>
                <span id="perfil-nombre">Hola, user</span>
            </button>
            <ul id="perfil-lista">
                <li><a href="./perfil.html">Mis pedidos</a></li>
                <li><a href="./perfil.html">Mis envios</a></li>
                <li><a href="./perfil.html">Mis pagos</a></li>
                <li><button id="cerrar-sesion-btn">Cerrar sesión</button></li>
            </ul>
        </div>
        </div>
        
        
    </header>

    <main>
        <div id="carrito-header">
            <div>
                <h1>Tu carrito</h1>
                <p id="cantidad-productos">0 productos en el carrito</p>
            </div>
           
            <button id="vaciar-carrito-btn">
                <i class="fa-solid fa-trash"></i>
                Vaciar carrito
            </button>

        </div>



        <div id="carrito-main-div">
            <div id="carrito-grid">

            </div>

            <div id="resumen-pedido-div">
                <h2>Resumen del pedido</h2>
                <div id="resumen-pedido-extra">
                    <div id="subtotal-div">
                        <span id="subtotal-valor">Subtotal</span>
                        <span id="monto-span">S/0</span>
                    </div>
                    <div id="envio-div">
                        <span>Envío</span>
                        <span id="gratis-span">Gratis</span>
                    </div>
                </div>

                <div id="total-div">
                    <span>Total</span>
                    <span id="monto-total-span">S/0</span>
                </div>

                <button type="submit" id="finalizar-compra-btn"><i class="fa-solid fa-cart-shopping"></i>Finalizar compra</button>

                <div id="resumen-pedido-footer">
                    <div id="seguridad-div">
                        <i class="fa-solid fa-shield-halved"></i>
                        <p>Pago 100% seguro y encriptado</p>
                    </div>
                    <div id="entrega-div">
                        <i class="fa-solid fa-truck"></i>
                        <p>Entrega en 24-48h en península</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
</body>
</html>
