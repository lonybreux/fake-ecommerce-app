services:
  api:
    build: 
      context: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db
    restart: always
  
  db:
    image: mongo:8.2
    container_name: mydatabase
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: